name: Deploy to GitHub Pages

# Publishes on every `v*` tag push, e.g. `git tag v1.2.0 && git push origin v1.2.0`.
# The pattern must stay in sync with the github-pages environment's deployment tag policy,
# which only permits `v*`: a tag matching here but not there is rejected at the environment
# gate seconds after the run starts, with no build log to explain it.
# No workflow_dispatch trigger: manual runs default to `main`, and the environment's policy
# is the authority on which refs may deploy — tag pushes are the only supported trigger.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight one finish rather than cancel it,
# since cancelling mid-deploy can leave Pages serving a half-published build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # GitHub Pages project sites are served from /<repo-name>/, not /.
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
